# Paste into the existing `server { ... }` block of EACH update mirror.
# Requires the scheduled sync script to populate the directory below.
location ^~ /rulesets/ru/ {
    alias /srv/arrow-updates/rulesets/ru/;
    autoindex off;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    types { application/octet-stream srs; text/plain txt; }
    default_type application/octet-stream;
}
